syntax = "proto3";

package mesh.v1;

option go_package = "github.com/itaic/agent-mesh/pkg/mesh/pb;meshpb";

import "a2a.proto";
import "google/protobuf/timestamp.proto";

// MeshService is what a running agent calls to reach the rest of the mesh —
// the inverse of A2AService (which the mesh calls to reach an agent). Scoped
// for now to two explicitly-named agents; CreateSubTaskRequest.target_agent_ref
// is a direct name, not a skill query. Selection/discovery across many
// candidate agents is the next growth point for this file.
service MeshService {
  // CreateSubTask dispatches work to a named agent by creating a Task CR on
  // the caller's behalf. Fire-and-forget: it returns the created Task's
  // name, not its remote state — TaskReconciler still owns dispatch/polling.
  rpc CreateSubTask(CreateSubTaskRequest) returns (CreateSubTaskResponse);

  // GetAgentInfo reports a named agent's declared skills and readiness, so
  // a caller can decide what to ask it for before dispatching. Stands in
  // for real discovery until multi-agent selection exists.
  rpc GetAgentInfo(GetAgentInfoRequest) returns (GetAgentInfoResponse);

  // WatchSubTask streams a subtask's status/thought/artifact updates until
  // it reaches a terminal state, so the caller isn't stuck polling. Mirrors
  // a2a.v1's SubscribeToTask one layer up: TaskReconciler already pulls the
  // target agent's own updates onto the Task CR (task_controller.go) by
  // dialing agent 2's standard A2A endpoints — agent 2 never needs to know
  // the mesh exists. WatchSubTask just re-streams that CR's changes back
  // out to the original caller (agent 1).
  rpc WatchSubTask(WatchSubTaskRequest) returns (stream SubTaskUpdate);
}

message CreateSubTaskRequest {
  string caller_agent_ref = 1; // name of the Agent CR making the request
  string target_agent_ref = 2; // name of the Agent CR to dispatch to
  string namespace = 3;        // namespace both Agents and the new Task live in
  a2a.v1.Message message = 4;
  string skill_id = 5;
  string context_id = 6;
}

message CreateSubTaskResponse {
  string task_id = 1; // name of the created Task CR
}

message GetAgentInfoRequest {
  string agent_ref = 1;
  string namespace = 2;
}

message GetAgentInfoResponse {
  string name = 1;
  bool ready = 2;
  repeated string skill_ids = 3;
  string description = 4;
}

message WatchSubTaskRequest {
  string task_id = 1;   // Task CR name, as returned by CreateSubTaskResponse
  string namespace = 2;
}

// SubTaskStatus carries a lifecycle transition (submitted/working/completed/
// etc.) — the "what stage is this at" signal, not the play-by-play.
message SubTaskStatus {
  a2a.v1.TaskState state = 1;
}

// ThoughtEvent carries the agent's own narration of what it's doing right
// now — derived from the target agent's status_message while it's still
// working, as opposed to artifacts (the actual deliverable content). agent_id
// /task_id/seq are synthesized by the mesh (from the Task CR and an
// in-process counter), not sent by the target agent itself.
message ThoughtEvent {
  string agent_id = 1;
  string task_id = 2;
  uint64 seq = 3;
  google.protobuf.Timestamp ts = 4;
  string content = 5;
}

message SubTaskUpdate {
  oneof event {
    SubTaskStatus status_update = 1;
    ThoughtEvent thought_event = 2;
    a2a.v1.Artifact artifact_update = 3;
  }
  bool final = 4; // true once the subtask has reached a terminal state
}
