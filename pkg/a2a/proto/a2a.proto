syntax = "proto3";

package a2a.v1;

option go_package = "github.com/itaic/agent-mesh/pkg/a2a/pb;a2apb";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A2AService is the gRPC binding of the Agent2Agent protocol, trimmed to the
// operations agent-mesh's controllers actually drive. Field/method names
// track the official spec's a2a.v1 package (AgentCard, Task, Message,
// TaskStatusUpdateEvent) so this stays a drop-in for real A2A agents rather
// than a bespoke dialect.
service A2AService {
  // GetAgentCard returns the capability declaration this agent presents to
  // the mesh. AgentReconciler calls this to populate Agent.status.
  rpc GetAgentCard(GetAgentCardRequest) returns (AgentCard);

  // SendMessage starts (or continues) a task with an initial user message.
  // Returns immediately with a Task in state SUBMITTED or WORKING; the
  // agent keeps working it in the background.
  rpc SendMessage(SendMessageRequest) returns (Task);

  // GetTask polls current task state — what TaskReconciler uses when it
  // isn't (yet) subscribed to the stream.
  rpc GetTask(GetTaskRequest) returns (Task);

  // CancelTask requests cooperative cancellation of an in-flight task.
  rpc CancelTask(CancelTaskRequest) returns (Task);

  // SubscribeToTask server-streams status/artifact updates until the task
  // reaches a terminal state, avoiding poll overhead for long-running work.
  rpc SubscribeToTask(GetTaskRequest) returns (stream TaskUpdate);
}

message Skill {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  repeated string examples = 5;
}

message AgentCard {
  string name = 1;
  string description = 2;
  string version = 3;
  repeated Skill skills = 4;
  repeated string preferred_transport = 5; // e.g. ["grpc", "jsonrpc"]
  // signature carries the I/O-2026-era cryptographic domain verification
  // for the card; empty for unsigned/dev agents.
  string signature = 6;
}

message Part {
  oneof content {
    string text = 1;
    google.protobuf.Struct data = 2;
    string file_uri = 3;
  }
  string mime_type = 4;
}

message Message {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    USER = 1;
    AGENT = 2;
  }
  Role role = 1;
  repeated Part parts = 2;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  SUBMITTED = 1;
  WORKING = 2;
  INPUT_REQUIRED = 3;
  AUTH_REQUIRED = 4;
  COMPLETED = 5;
  CANCELED = 6;
  FAILED = 7;
  REJECTED = 8;
}

message Artifact {
  string name = 1;
  repeated Part parts = 2;
}

message Task {
  string id = 1;
  string context_id = 2;
  TaskState state = 3;
  Message status_message = 4;
  repeated Artifact artifacts = 5;
  repeated Message history = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TaskUpdate {
  oneof event {
    Task status_update = 1;
    Artifact artifact_update = 2;
  }
  bool final = 3; // true once the task has reached a terminal state
}

message GetAgentCardRequest {}

message SendMessageRequest {
  Message message = 1;
  string context_id = 2;
  string skill_id = 3;
}

message GetTaskRequest {
  string id = 1;
}

message CancelTaskRequest {
  string id = 1;
}
