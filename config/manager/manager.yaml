apiVersion: v1
kind: Namespace
metadata:
  name: agent-mesh-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-mesh-controller-manager
  namespace: agent-mesh-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-mesh-controller-manager
  namespace: agent-mesh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: agent-mesh-controller-manager
  template:
    metadata:
      labels:
        control-plane: agent-mesh-controller-manager
    spec:
      serviceAccountName: agent-mesh-controller-manager
      containers:
      - name: manager
        image: ghcr.io/itaic/agent-mesh:latest
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
